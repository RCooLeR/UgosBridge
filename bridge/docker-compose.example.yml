name: ugos-bridge

services:
  ugos-bridge:
    image: ugos-bridge:local
    build:
      context: ..
      dockerfile: bridge/Dockerfile
      pull: true
    container_name: ugos-bridge
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/local/bin/ugos-bridge", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Optional for intel_gpu_top on Intel iGPU hosts:
    # Enabling privileged mode overrides most of the hardening above.
    # privileged: true
    # pid: host
    ports:
      - "9877:9877"
    # Makes host.docker.internal resolve to the NAS host on Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      UGOS_BRIDGE_LISTEN_ADDRESS: ":9877"
      UGOS_BRIDGE_DOCKER_HOST: "unix:///var/run/docker.sock"
      UGOS_BRIDGE_SCRAPE_INTERVAL: "15s"
      # UGOS_BRIDGE_DETAILED_CONTAINER_STATS: "true"
      UGOS_BRIDGE_HOST_METRICS_ENABLED: "true"
      UGOS_BRIDGE_HOST_PROCFS: "/host/proc"
      UGOS_BRIDGE_HOST_SYSFS: "/host/sys"
      # Keep this fixed: it is part of the Home Assistant host entity identity.
      UGOS_BRIDGE_HOST_NAME: "ugreen-nas"
      UGOS_BRIDGE_HOST_HOSTNAME_PATH: "/rootfs/etc/hostname"
      UGOS_BRIDGE_HOST_FILESYSTEMS: "/:/rootfs,/volume1:/volume1,/volume2:/volume2"
      UGOS_BRIDGE_HOST_DRI_PATH: "/dev/dri"
      # UGOS_BRIDGE_HOST_TEMPERATURE_AVERAGE_WINDOW: "2m"
      # Optional UPS monitoring through NUT upsc:
      # UGOS_BRIDGE_HOST_UPS_ENABLED: "true"
      # UGOS_BRIDGE_HOST_UPS_COMMAND: "upsc"
      # Use "ups@localhost" only with host networking or a NUT server inside this container.
      # For a NUT server on the NAS host, use the NAS IP or host.docker.internal when available.
      # UGOS_BRIDGE_HOST_UPS_TARGETS: "ups@host.docker.internal"
      # UGOS_BRIDGE_HOST_UPS_TIMEOUT: "3s"
      UGOS_BRIDGE_HOST_VMS_ENABLED: "true"
      UGOS_BRIDGE_HOST_VIRSH_URI: "qemu:///system"
      # Optional VM display name overrides keyed by the UGOS Virtual Machine app domain/id:
      # UGOS_BRIDGE_VM_NAMES: "ugos-app-vm-id-1:Windows 11,ugos-app-vm-id-2:Ubuntu Server"
      # UGOS_BRIDGE_HOST_INTEL_GPU_TOP_ENABLED: "true"
      # UGOS_BRIDGE_HOST_INTEL_GPU_TOP_DEVICE: "drm:/dev/dri/renderD128"
      # UGOS_BRIDGE_HOST_INTEL_GPU_TOP_PERIOD: "1s"
      UGOS_BRIDGE_MQTT_ENABLED: "true"
      UGOS_BRIDGE_MQTT_BROKER: "tcp://host.docker.internal:1883"
      UGOS_BRIDGE_MQTT_USER: "ha"
      UGOS_BRIDGE_MQTT_PASS: "change_me"
      # Keep the MQTT client ID and topic prefix fixed across container rebuilds.
      UGOS_BRIDGE_MQTT_CLIENT_ID: "ugos_bridge"
      UGOS_BRIDGE_MQTT_TOPIC_PREFIX: "ugos_bridge"
      UGOS_BRIDGE_MQTT_DISCOVERY_PREFIX: "homeassistant"
      UGOS_BRIDGE_MQTT_INTERVAL: "60"
      UGOS_BRIDGE_MQTT_RETAIN: "true"
      UGOS_BRIDGE_MQTT_ENTITY_GRACE: "180"
      # UGOS_BRIDGE_MQTT_PROCESS_ALLOWLIST: "dockerd,containerd"
    volumes:
      # Security boundary: Docker's API grants host-root-equivalent control even
      # when the socket itself is mounted read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /volume1:/volume1:ro
      - /volume2:/volume2:ro
      - /var/run/libvirt:/var/run/libvirt:ro
      - /dev/dri:/dev/dri

