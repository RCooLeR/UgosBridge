# Validated with GoReleaser v2.18.0.
version: 2

project_name: ugos-bridge

before:
  hooks:
    - go -C bridge mod download

builds:
  - id: ugos-bridge
    dir: bridge
    main: .
    binary: ugos-bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto
  preflight:
    fail_on_error: true

changelog:
  use: git

dockers_v2:
  - id: dockerhub
    ids:
      - ugos-bridge
    dockerfile: bridge/Dockerfile.goreleaser
    images:
      - rcooler/ugos-bridge
      - rcooler/ugos-exporter
    tags:
      - "{{ .Version }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}{{ .Major }}{{ end }}"
    labels:
      org.opencontainers.image.title: ugos-bridge
      org.opencontainers.image.description: Lightweight UGOS and Docker metrics bridge for NAS hosts and Compose stacks
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      "manifest:org.opencontainers.image.title": ugos-bridge
      "manifest:org.opencontainers.image.description": Lightweight UGOS and Docker metrics bridge for NAS hosts and Compose stacks
      "manifest:org.opencontainers.image.url": "{{ .GitURL }}"
      "manifest:org.opencontainers.image.source": "{{ .GitURL }}"
      "manifest:org.opencontainers.image.licenses": MIT
      "manifest:org.opencontainers.image.version": "{{ .Version }}"
      "manifest:org.opencontainers.image.created": "{{ .CommitDate }}"
      "manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index:org.opencontainers.image.title": '{{ if not .IsSnapshot }}ugos-bridge{{ end }}'
      "index:org.opencontainers.image.description": '{{ if not .IsSnapshot }}Lightweight UGOS and Docker metrics bridge for NAS hosts and Compose stacks{{ end }}'
      "index:org.opencontainers.image.url": '{{ if not .IsSnapshot }}{{ .GitURL }}{{ end }}'
      "index:org.opencontainers.image.source": '{{ if not .IsSnapshot }}{{ .GitURL }}{{ end }}'
      "index:org.opencontainers.image.licenses": '{{ if not .IsSnapshot }}MIT{{ end }}'
      "index:org.opencontainers.image.version": '{{ if not .IsSnapshot }}{{ .Version }}{{ end }}'
      "index:org.opencontainers.image.created": '{{ if not .IsSnapshot }}{{ .CommitDate }}{{ end }}'
      "index:org.opencontainers.image.revision": '{{ if not .IsSnapshot }}{{ .FullCommit }}{{ end }}'
    # Snapshot images are loaded into the local Docker store, whose exporter
    # cannot load the manifest lists created by attestations. Tagged releases
    # still publish both SBOMs and maximum provenance.
    sbom: "{{ not .IsSnapshot }}"
    flags:
      - '{{ if .IsSnapshot }}--provenance=false{{ else }}--provenance=mode=max{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64

docker_digest:
  name_template: digests.txt
