# Validated with GoReleaser v2.18.0.
version: 2

project_name: ugos-bridge

before:
  hooks:
    - go -C bridge mod download

builds:
  - id: ugos-bridge
    dir: bridge
    main: .
    binary: ugos-bridge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  prerelease: auto
  preflight:
    fail_on_error: true

changelog:
  use: git

dockers_v2:
  - id: dockerhub
    ids:
      - ugos-bridge
    dockerfile: bridge/Dockerfile.goreleaser
    images:
      - rcooler/ugos-bridge
      - rcooler/ugos-exporter
    tags:
      - "{{ .Version }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}{{ .Major }}{{ end }}"
    labels:
      org.opencontainers.image.title: ugos-bridge
      org.opencontainers.image.description: Lightweight UGOS and Docker metrics bridge for NAS hosts and Compose stacks
      org.opencontainers.image.url: "{{ .GitURL }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    annotations:
      "index,manifest:org.opencontainers.image.title": ugos-bridge
      "index,manifest:org.opencontainers.image.description": Lightweight UGOS and Docker metrics bridge for NAS hosts and Compose stacks
      "index,manifest:org.opencontainers.image.url": "{{ .GitURL }}"
      "index,manifest:org.opencontainers.image.source": "{{ .GitURL }}"
      "index,manifest:org.opencontainers.image.licenses": MIT
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.created": "{{ .CommitDate }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
    sbom: true
    flags:
      - "--provenance=mode=max"
    platforms:
      - linux/amd64
      - linux/arm64

docker_digest:
  name_template: digests.txt
